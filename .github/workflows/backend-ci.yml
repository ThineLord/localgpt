name: Synthetic backend CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: synthetic-backend-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    # No runner is allocated until a separately verified zero-cost authorization
    # names this exact SHA. A skipped job is NOT acceptance evidence.
    if: >-
      vars.APP03_CI_AUTHORIZED_SHA != '' &&
      vars.APP03_CI_AUTHORIZED_SHA == (github.event.pull_request.head.sha || github.sha)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2 # ci.py verifies the final commit diff against its parent
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install CI dependencies (no cache)
        run: python -m pip install --disable-pip-version-check --no-cache-dir -r requirements-ci.txt
      - name: Verify exact source and synthetic regressions
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python tools/ci.py --expected-sha "$EXPECTED_SHA"
